<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 160" width="820" height="160" fill="none">
  <style>
    .bg { fill: #09090b; stroke: #27272a; stroke-width: 1; rx: 8px; }
    .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; fill: #ffffff; letter-spacing: 2px; }
    .tagline { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #a1a1aa; }
    .subtext { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; fill: #71717a; letter-spacing: 0.5px; }
    .grid-line { stroke: #27272a; stroke-width: 0.5; stroke-dasharray: 4 4; }
    .dot { fill: #3f3f46; }
    .active-dot { fill: #22c55e; }
  </style>

  <rect width="820" height="160" class="bg"/>

  <!-- Subtle Grid Accent -->
  <line x1="30" y1="0" x2="30" y2="160" class="grid-line"/>
  <line x1="790" y1="0" x2="790" y2="160" class="grid-line"/>
  <line x1="0" y1="40" x2="820" y2="40" class="grid-line"/>
  <line x1="0" y1="120" x2="820" y2="120" class="grid-line"/>

  <!-- Left Header Content -->
  <g transform="translate(50, 48)">
    <text x="0" y="22" class="title">DARNELL <tspan fill="#52525b" font-weight="400">/ DRNZY</tspan></text>
    <text x="0" y="46" class="tagline">Systems software, desktop runtimes, and local-first tools.</text>
  </g>

  <!-- Right Status Capsule -->
  <g transform="translate(570, 52)">
    <rect width="200" height="56" rx="6" fill="#141416" stroke="#27272a" stroke-width="1"/>
    <circle cx="20" cy="28" r="4" class="active-dot"/>
    <text x="32" y="24" class="subtext" fill="#ffffff" font-weight="600">CACHYOS // LINUX</text>
    <text x="32" y="40" class="subtext">Rust · TypeScript · C++</text>
  </g>
</svg>
